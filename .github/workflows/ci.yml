name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Verify CLI Execution & Self Check
        run: |
          bun ./bin/cli.js version
          bun ./bin/cli.js check

      - name: Verify Surgical Diff Tool
        run: |
          python3 scripts/verify_surgical_diff.py --self-test
          python3 skills/expected-2-unexpected/scripts/verify_surgical_diff.py --self-test

      - name: Run Skill Validation
        run: |
          python3 -c "
          import re, yaml
          content = open('SKILL.md').read()
          assert content.startswith('---'), 'Missing YAML frontmatter'
          match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          assert match, 'Invalid frontmatter format'
          fm = yaml.safe_load(match.group(1))
          assert fm.get('name') == 'expected-2-unexpected', 'Invalid name'
          assert len(fm.get('description', '')) > 20, 'Description too short'
          print('✅ SKILL.md validated successfully!')
          "
